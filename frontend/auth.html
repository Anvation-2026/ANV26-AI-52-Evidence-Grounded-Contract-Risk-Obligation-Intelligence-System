<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · Contract Intelligence</title><link rel="stylesheet" href="style.css"><style>body.auth-page{min-height:100vh;display:grid;place-items:center;background:var(--bg,#0b1110);padding:24px}.auth-shell{width:min(440px,100%);border:1px solid var(--border,#26332f);border-radius:20px;padding:32px;background:var(--panel,#121b18);box-shadow:0 24px 80px #0004}.auth-brand{display:flex;gap:12px;align-items:center;margin-bottom:28px}.auth-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:#123c2c;color:#7ce2ad;font-size:22px}.auth-brand h1{font-size:18px;margin:0}.auth-brand p{margin:4px 0 0;color:var(--muted,#9aa9a1);font-size:12px}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:#0d1412;border-radius:10px;margin:22px 0}.auth-tabs button{border:0;background:transparent;color:var(--muted,#9aa9a1);padding:10px;border-radius:8px;cursor:pointer}.auth-tabs button.active{background:#23372e;color:#e6fff0}.auth-form label{display:block;font-size:13px;margin:14px 0 7px;color:var(--text,#e9f0ec)}.auth-form input{width:100%;box-sizing:border-box;border:1px solid var(--border,#26332f);border-radius:9px;padding:12px;background:#0d1412;color:var(--text,#e9f0ec);outline:none}.auth-form input:focus{border-color:#39a66e}.auth-submit{width:100%;border:0;border-radius:9px;padding:12px;margin-top:20px;background:#16834e;color:white;font-weight:600;cursor:pointer}.auth-error{display:none;margin-top:14px;color:#ffb4a9;font-size:13px}.auth-hint{font-size:12px;color:var(--muted,#9aa9a1);line-height:1.5;margin-top:18px}.auth-title{font-size:25px;margin:0}.auth-subtitle{font-size:14px;color:var(--muted,#9aa9a1);margin:8px 0 0}</style></head>
<body class="auth-page"><main class="auth-shell"><div class="auth-brand"><div class="auth-mark">◈</div><div><h1>Contract Intelligence</h1><p>Evidence-grounded contract review</p></div></div><h2 class="auth-title" id="formTitle">Welcome back</h2><p class="auth-subtitle" id="formSubtitle">Sign in to your review workspace.</p><div class="auth-tabs"><button id="loginTab" class="active" type="button">Sign in</button><button id="registerTab" type="button">Create account</button></div><form id="authForm" class="auth-form"><div id="nameField" hidden><label for="name">Full name</label><input id="name" autocomplete="name" minlength="2" maxlength="120" placeholder="Your name"></div><label for="email">Work email</label><input id="email" type="email" required autocomplete="email" placeholder="you@company.com"><label for="password">Password</label><input id="password" type="password" required minlength="8" autocomplete="current-password" placeholder="At least 8 characters"><button class="auth-submit" id="submitButton" type="submit">Sign in</button><div class="auth-error" id="authError" role="alert"></div></form><p class="auth-hint">Your workspace is intended for contract review. Keep credentials private. This prototype uses local token-based authentication; configure a strong AUTH_SECRET before deployment.</p></main><script src="auth.js"></script></body></html>
